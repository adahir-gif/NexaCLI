name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUTPUT="nexacli-${{ matrix.suffix }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${OUTPUT}" \
            ./cmd/nexacli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexacli-${{ matrix.suffix }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum nexacli-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "NexaCLI ${{ github.ref_name }}"
          body: |
            ## Installation

            **Linux / macOS**
            ```bash
            curl -fsSL https://nexacli-production.up.railway.app/install.sh | bash
            ```

            **Windows (PowerShell)**
            ```powershell
            iwr -useb https://nexacli-production.up.railway.app/install.ps1 | iex
            ```

            See [CHANGELOG.md](https://github.com/adahir-gif/NexaCLI/blob/main/CHANGELOG.md) for what's new.
          files: |
            dist/nexacli-*
            dist/checksums.txt
          generate_release_notes: true
